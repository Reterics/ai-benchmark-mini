[project]
name = "ai-benchmark-mini"
version = "0.1.0"
description = "Benchmark AI models using reusable prompts and structured evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "ollama>=0.1.0",
]

[project.optional-dependencies]
development = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ai-benchmark = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
